name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pip install pillow
      - name: Build
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n1)
          if [ -n "$ZIP" ]; then mkdir -p work && unzip -q "$ZIP" -d work; fi
          PKG=$(find . -name package.json -not -path "*/node_modules/*" | head -n1)
          cd "$(dirname "$PKG")"
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: "**/app-debug.apk"
